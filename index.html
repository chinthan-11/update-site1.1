<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chinthan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #000000;
    --ink: #f5f5f5;
    --muted: #8c8c8c;
    --line: #2b2b2b;
    --panel: #111111;
    --hover: #1d1d1d;

    --x: #000000;
    --email: #ea4335;
    --github: #238636;
    --linkedin: #0a66c2;

    --font: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Top bar: menu + search ---------- */
  .top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 22px clamp(16px, 4vw, 40px) 0;
    position: relative;
    z-index: 10;
  }

  .menu-wrap { position: relative; flex: none; }

  .menu-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 64px;
    padding: 0 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .menu-btn:hover, .menu-btn[aria-expanded="true"] { background: var(--hover); border-color: #444; }
  .menu-btn svg { width: 20px; height: 20px; }

  .panel {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    min-width: 250px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,.8);
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 16px;
    background: none;
    border: 0;
    border-radius: 14px;
    text-align: left;
    font-size: 1rem;
  }
  .item:hover, .item:focus-visible { background: var(--hover); }
  .item svg { width: 20px; height: 20px; flex: none; }
  .item .grow { flex: 1; }
  .chev { transition: transform .2s; color: var(--muted); }
  .item[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .sub { list-style: none; margin: 2px 0 6px 18px; padding: 0 0 0 12px; border-left: 1px solid var(--line); }
  .sub .item { padding: 10px 14px; }
  .ico-x { color: #fff; }
  .ico-ig { color: #e4405f; }
  .ico-li { color: var(--linkedin); }
  .ico-mail { color: var(--email); }

  /* ---------- Search ---------- */
  .search { position: relative; flex: 1; min-width: 0; }
  .search-field {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 64px;
    padding: 0 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: border-color .15s, background .15s;
  }
  .search-field:focus-within { border-color: #6a6a6a; background: #161616; }
  .search-field svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
  .search input {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: none;
    border: 0;
    outline: 0;
    color: var(--ink);
    font: inherit;
    font-size: 1.2rem;
  }
  .search input::placeholder { color: #6f6f6f; }
  .search input::-webkit-search-cancel-button { display: none; }

  .results {
    position: absolute;
    top: calc(100% + 10px);
    left: 0; right: 0;
    margin: 0;
    padding: 8px;
    list-style: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,.8);
    animation: pop .16s ease-out;
  }
  .results li { border-radius: 14px; }
  .results button.item[aria-selected="true"] { background: var(--hover); }
  .results .kind { margin-left: auto; color: var(--muted); font-size: .85rem; }
  .empty { padding: 14px 16px; color: var(--muted); }

  /* ---------- Hero ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px clamp(20px, 5vw, 48px) 72px;
    gap: 44px;
  }

  h1 { margin: 0; font-weight: 400; }
  .hello {
    display: block;
    font-size: clamp(2.6rem, 8.2vw, 6.6rem);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.035em;
    font-variation-settings: "opsz" 96;
    animation: rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  .thanks {
    display: block;
    margin-top: 18px;
    font-size: clamp(1.15rem, 2.6vw, 1.8rem);
    font-weight: 400;
    color: var(--muted);
    letter-spacing: -0.01em;
    animation: rise .8s .12s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* ---------- Three buttons ---------- */
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    border: 1px solid transparent;
    border-radius: 22px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    transition: transform .15s, filter .15s;
  }
  .btn svg { width: 22px; height: 22px; }
  .btn:hover { transform: translateY(-3px); filter: brightness(1.12); }
  .btn:active { transform: translateY(0); }
  .btn-x { background: var(--x); border-color: #3a3a3a; }
  .btn-email { background: var(--email); }
  .btn-github { background: var(--github); }

  /* ---------- Insider gate ---------- */
  .insider { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; margin-top: -8px; }
  .btn-insider {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px;
    background: transparent;
    border: 1px solid #4a4a4a;
    border-radius: 22px;
    font-size: 1.05rem; font-weight: 500; color: var(--ink);
    transition: background .15s, border-color .15s;
  }
  .btn-insider:hover, .btn-insider[aria-expanded="true"] { background: var(--panel); border-color: #8a8a8a; }
  .btn-insider svg { width: 20px; height: 20px; }

  .gate {
    width: min(440px, 100%);
    padding: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    animation: pop .16s ease-out;
  }
  .gate-title { margin: 0 0 14px; font-size: 1.15rem; font-weight: 700; }
  .code-input {
    width: 100%; height: 56px; padding: 0 22px;
    background: #000; border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); font: inherit; font-size: 1.15rem;
    text-align: center; letter-spacing: .12em; outline: 0;
  }
  .code-input::placeholder { color: #6f6f6f; letter-spacing: normal; }
  .code-input:focus { border-color: #6a6a6a; }
  .code-input.bad { border-color: var(--email); animation: shake .3s; }
  .gate-err { min-height: 1.4em; margin: 10px 0 0; color: #ff6b5e; font-size: .95rem; }
  .gate-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  .gate-btn { padding: 12px 22px; border: 1px solid transparent; border-radius: 18px; font-weight: 700; transition: filter .15s, background .15s; }
  .gate-btn.primary { background: #ffffff; color: #000000; }
  .gate-btn.primary:hover { filter: brightness(.88); }
  .gate-btn.ghost { background: transparent; border-color: #4a4a4a; color: var(--ink); }
  .gate-btn.ghost:hover { background: var(--hover); }

  .status {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); font-weight: 500;
    animation: pop .16s ease-out;
  }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--github); }
  .status.is-general .dot { background: #8c8c8c; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ---------- Insider gallery ---------- */
  .gallery { width: min(1000px, 100%); margin-top: 12px; animation: pop .2s ease-out; }
  .gallery-head { margin: 0 0 20px; text-align: center; }
  .gallery-head h2 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  .gallery-head p { margin: 4px 0 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
  .thumb { display: block; width: 100%; aspect-ratio: 3 / 4; padding: 0; border: 0; background: #0a0a0a; cursor: zoom-in; overflow: hidden; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transition: transform .3s; }
  .thumb:hover img { transform: scale(1.04); }
  .card-actions { display: flex; gap: 8px; padding: 12px; }
  .card-actions .gate-btn { flex: 1; padding: 10px 12px; font-size: .95rem; }

  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
    background: rgba(0,0,0,.94);
  }
  .lightbox img { display: block; max-width: 100%; max-height: calc(100% - 72px); object-fit: contain; border-radius: 14px; }
  .lightbox .bar { display: flex; gap: 10px; }

  /* ---------- Footer ---------- */
  footer {
    padding: 26px 20px 30px;
    text-align: center;
    color: var(--muted);
    font-size: .95rem;
    border-top: 1px solid var(--line);
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 640px) {
    .top { gap: 10px; }
    .menu-btn { height: 56px; padding: 0 18px; }
    .menu-btn .label { display: none; }
    .search-field { height: 56px; padding: 0 18px; gap: 10px; }
    .search input { font-size: 1rem; }
    .panel { min-width: 230px; }
    .btn { padding: 15px 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="menu-wrap">
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menuPanel" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="label">Menu</span>
    </button>

    <nav class="panel" id="menuPanel" aria-label="Main menu" hidden>
      <a class="item" href="#home" id="homeLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg>
        Home
      </a>
      <button class="item" id="contactToggle" aria-expanded="false" aria-controls="contactList">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="grow">Contact</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <ul class="sub" id="contactList" hidden>
        <li><a class="item" data-link="x" target="_blank" rel="noopener"><svg class="ico-x" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-x"/></svg>X</a></li>
        <li><a class="item" data-link="instagram" target="_blank" rel="noopener"><svg class="ico-ig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-instagram"/></svg>Instagram</a></li>
        <li><a class="item" data-link="linkedin" target="_blank" rel="noopener"><svg class="ico-li" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-linkedin"/></svg>LinkedIn</a></li>
        <li><a class="item" data-link="email"><svg class="ico-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-mail"/></svg>Email</a></li>
      </ul>
    </nav>
  </div>

  <div class="search" role="search">
    <label class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search Home, Contact, X, Instagram, LinkedIn, Email" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Search the menu">
    </label>
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>
</header>

<main id="home">
  <h1>
    <span class="hello">Hey there, I am Chinthan,</span>
    <span class="thanks">thanks for visiting my webpage.</span>
  </h1>

  <div class="btns">
    <a class="btn btn-x" data-link="x" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-x"/></svg>X
    </a>
    <a class="btn btn-email" data-link="email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-mail"/></svg>Email
    </a>
    <a class="btn btn-github" data-link="github" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-github"/></svg>GitHub
    </a>
  </div>

  <section class="insider" aria-label="Insider access">
    <button class="btn-insider" id="insiderBtn" type="button" aria-expanded="false" aria-controls="gate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Are you a insider?
    </button>

    <div class="gate" id="gate" hidden>
      <p class="gate-title">Enter the code</p>
      <input class="code-input" id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="10" placeholder="Enter the code" aria-label="Insider code" aria-describedby="gateErr">
      <p class="gate-err" id="gateErr" role="alert"></p>
      <div class="gate-row">
        <button class="gate-btn primary" id="codeGo" type="button">Enter</button>
        <button class="gate-btn ghost" id="generalGo" type="button">Access general without code</button>
      </div>
    </div>

    <div class="status" id="status" role="status" hidden><span class="dot"></span><span id="statusText"></span></div>

    <div class="gallery" id="gallery" hidden>
      <div class="gallery-head">
        <h2>Insider gallery</h2>
        <p>Tap a photo to view it, or download it.</p>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <img id="lbImg" alt="">
  <div class="bar">
    <button class="gate-btn primary" id="lbDownload" type="button">Download</button>
    <button class="gate-btn ghost" id="lbClose" type="button">Close</button>
  </div>
</div>

<footer>Built by Chinthan with stupidity for no reason.</footer>

<!-- Icon sprites -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="i-x" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>

    <g id="i-instagram"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></g>
    <g id="i-mail"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/></g>
  </defs>
</svg>

<script>
  /* ============================================================
     EDIT THESE: put your real links here.
     ============================================================ */
  var LINKS = {
    x:        "https://x.com/Ktchinthan",
    github:   "https://github.com/chinthan-11",
    instagram: "https://www.instagram.com/chinthan.11",
    linkedin: "https://www.linkedin.com/in/your-profile",
    email:    "mailto:chinthan@chinthan.online"
  };

  // Wire every link on the page
  document.querySelectorAll("[data-link]").forEach(function (a) {
    a.setAttribute("href", LINKS[a.dataset.link]);
  });

  // ---------- Menu ----------
  var menuBtn = document.getElementById("menuBtn");
  var panel = document.getElementById("menuPanel");
  var contactToggle = document.getElementById("contactToggle");
  var contactList = document.getElementById("contactList");

  function setMenu(open) {
    panel.hidden = !open;
    menuBtn.setAttribute("aria-expanded", String(open));
    if (!open) setContact(false);
  }
  function setContact(open) {
    contactList.hidden = !open;
    contactToggle.setAttribute("aria-expanded", String(open));
  }

  menuBtn.addEventListener("click", function () { setMenu(panel.hidden); });
  contactToggle.addEventListener("click", function () { setContact(contactList.hidden); });
  document.getElementById("homeLink").addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
    setMenu(false);
  });

  // ---------- Search ----------
  var ITEMS = [
    { label: "Home",     kind: "Page",    run: function () { window.scrollTo({ top: 0, behavior: "smooth" }); setMenu(false); } },
    { label: "Contact",  kind: "Menu",    run: function () { setMenu(true); setContact(true); } },
    { label: "X",        kind: "Contact", run: function () { window.open(LINKS.x, "_blank", "noopener"); } },
    { label: "Instagram", kind: "Contact", run: function () { window.open(LINKS.instagram, "_blank", "noopener"); } },
    { label: "LinkedIn", kind: "Contact", run: function () { window.open(LINKS.linkedin, "_blank", "noopener"); } },
    { label: "Email",    kind: "Contact", run: function () { window.location.href = LINKS.email; } }
  ];

  var q = document.getElementById("q");
  var results = document.getElementById("results");
  var matches = [];
  var active = 0;

  function render() {
    var term = q.value.trim().toLowerCase();
    matches = ITEMS.filter(function (it) { return it.label.toLowerCase().indexOf(term) !== -1; });
    if (active >= matches.length) active = 0;
    results.innerHTML = "";

    if (!matches.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing matches \u201C" + q.value.trim() + "\u201D. Try Home, Contact, X, Instagram, LinkedIn or Email.";
      results.appendChild(li);
    } else {
      matches.forEach(function (it, i) {
        var li = document.createElement("li");
        li.setAttribute("role", "presentation");
        var b = document.createElement("button");
        b.type = "button";
        b.className = "item";
        b.setAttribute("role", "option");
        b.setAttribute("aria-selected", String(i === active));
        b.innerHTML = '<span></span><span class="kind"></span>';
        b.children[0].textContent = it.label;
        b.children[1].textContent = it.kind;
        b.addEventListener("mousedown", function (e) { e.preventDefault(); });
        b.addEventListener("click", function () { choose(it); });
        li.appendChild(b);
        results.appendChild(li);
      });
    }
    results.hidden = false;
    q.setAttribute("aria-expanded", "true");
  }

  function closeResults() {
    results.hidden = true;
    q.setAttribute("aria-expanded", "false");
  }

  function choose(it) {
    closeResults();
    q.value = "";
    q.blur();
    it.run();
  }

  q.addEventListener("focus", render);
  q.addEventListener("input", function () { active = 0; render(); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" && matches.length) { e.preventDefault(); active = (active + 1) % matches.length; render(); }
    else if (e.key === "ArrowUp" && matches.length) { e.preventDefault(); active = (active - 1 + matches.length) % matches.length; render(); }
    else if (e.key === "Enter" && matches[active]) { e.preventDefault(); choose(matches[active]); }
    else if (e.key === "Escape") { closeResults(); q.blur(); }
  });

  // Close popups when clicking elsewhere or pressing Escape
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".menu-wrap")) setMenu(false);
    if (!e.target.closest(".search")) closeResults();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panel.hidden) { setMenu(false); menuBtn.focus(); }
  });

  // ---------- Insider gate ----------
  var insiderBtn = document.getElementById("insiderBtn");
  var gate = document.getElementById("gate");
  var codeInput = document.getElementById("code");
  var gateErr = document.getElementById("gateErr");
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");

  // A valid code is 10 characters: exactly 8 letters and 2 numbers, in any order.
  function isValidCode(c) {
    if (!/^[A-Za-z0-9]{10}$/.test(c)) return false;
    var letters = (c.match(/[A-Za-z]/g) || []).length;
    var digits = (c.match(/[0-9]/g) || []).length;
    return letters === 8 && digits === 2;
  }

  function openGate(open) {
    gate.hidden = !open;
    insiderBtn.setAttribute("aria-expanded", String(open));
    if (open) {
      statusEl.hidden = true;
      galleryEl.hidden = true;
      codeInput.value = "";
      gateErr.textContent = "";
      codeInput.classList.remove("bad");
      codeInput.focus();
    }
  }

  function grant(mode) {
    gate.hidden = true;
    insiderBtn.setAttribute("aria-expanded", "false");
    statusEl.className = "status is-" + mode;
    statusText.textContent = mode === "insider"
      ? "Welcome, insider. You're in."
      : "Welcome! You're viewing the general version.";
    statusEl.hidden = false;
    galleryEl.hidden = mode !== "insider";
    if (mode === "insider") buildGallery();
  }

  function submitCode() {
    var c = codeInput.value.trim();
    if (isValidCode(c)) {
      grant("insider");
    } else {
      gateErr.textContent = "That code isn't right. Try again, or access general.";
      codeInput.classList.remove("bad");
      void codeInput.offsetWidth;
      codeInput.classList.add("bad");
    }
  }

  insiderBtn.addEventListener("click", function () { openGate(gate.hidden); });
  document.getElementById("codeGo").addEventListener("click", submitCode);
  document.getElementById("generalGo").addEventListener("click", function () { grant("general"); });
  codeInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submitCode(); }
  });
  codeInput.addEventListener("input", function () {
    gateErr.textContent = "";
    codeInput.classList.remove("bad");
  });

  // ---------- Insider gallery ----------
  // The compressed photos live in the "gallery-data" block at the very bottom of this file.
  var galleryEl = document.getElementById("gallery");
  var gridEl = document.getElementById("grid");
  var lightbox = document.getElementById("lightbox");
  var lbImg = document.getElementById("lbImg");
  var photos = null, galleryBuilt = false, lbIndex = 0, lbReturnFocus = null;

  function getPhotos() {
    if (!photos) {
      try { photos = JSON.parse(document.getElementById("gallery-data").textContent); }
      catch (e) { photos = []; }
    }
    return photos;
  }

  function toBlob(dataUrl) {
    var bin = atob(dataUrl.split(",")[1]);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: "image/jpeg" });
  }

  function plainSave(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function savePhoto(p) {
    var blob = toBlob(p.data);
    // On your own hosting this is a normal browser download. Inside the Claude preview,
    // plain downloads are blocked, so the preview's own download prompt is used instead.
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (d) {
        if (d) { d.save({ filename: p.name, data: blob }).catch(function () {}); }
        else { plainSave(blob, p.name); }
      }).catch(function () { plainSave(blob, p.name); });
    } else {
      plainSave(blob, p.name);
    }
  }

  function openLightbox(i) {
    var list = getPhotos();
    if (!list[i]) return;
    lbIndex = i;
    lbImg.src = list[i].data;
    lbImg.alt = "Photo " + (i + 1) + " of " + list.length;
    lbReturnFocus = document.activeElement;
    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("lbClose").focus();
  }

  function closeLightbox() {
    lightbox.hidden = true;
    document.body.style.overflow = "";
    lbImg.removeAttribute("src");
    if (lbReturnFocus && lbReturnFocus.focus) lbReturnFocus.focus();
  }

  function makeBtn(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "gate-btn " + cls;
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }

  function buildGallery() {
    if (galleryBuilt) return;
    galleryBuilt = true;
    getPhotos().forEach(function (p, i) {
      var card = document.createElement("div");
      card.className = "card";

      var thumb = document.createElement("button");
      thumb.type = "button";
      thumb.className = "thumb";
      thumb.setAttribute("aria-label", "View photo " + (i + 1));
      var img = document.createElement("img");
      img.src = p.data;
      img.alt = "Photo " + (i + 1);
      thumb.appendChild(img);
      thumb.addEventListener("click", function () { openLightbox(i); });

      var acts = document.createElement("div");
      acts.className = "card-actions";
      acts.appendChild(makeBtn("View", "ghost", function () { openLightbox(i); }));
      acts.appendChild(makeBtn("Download", "primary", function () { savePhoto(p); }));

      card.appendChild(thumb);
      card.appendChild(acts);
      gridEl.appendChild(card);
    });
  }

  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  document.getElementById("lbDownload").addEventListener("click", function () { savePhoto(getPhotos()[lbIndex]); });
  lightbox.addEventListener("click", function (e) { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !lightbox.hidden) closeLightbox();
  });
</script>
